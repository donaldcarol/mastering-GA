name: Salut
description: Generează și afișează un salut

inputs:
  person:
    description: Pe cine salutăm
    required: true

  demo-token:
    description: Token pentru exercițiu
    required: true

outputs:
  message:
    description: Salutul generat
    value: ${{ steps.generate.outputs.message }}

runs:
  using: composite
  steps:
    - name: Generează salutul
      id: generate
      shell: bash
      env:
        PERSON: ${{ inputs.person }}
      run: |
        MESSAGE="Salut, $PERSON!"
        printf '%s\n' "$MESSAGE"
        printf 'message=%s\n' "$MESSAGE" >> "$GITHUB_OUTPUT"

    - name: Afișează runnerul
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
      run: |
        printf 'Rulez pe: %s\n' "$RUNNER_OS"

    - name: Verifică tokenul primit
      shell: bash
      env:
        DEMO_TOKEN: ${{ inputs.demo-token }}
      run: |
        if [ -z "$DEMO_TOKEN" ]; then
          echo "::error::Tokenul lipsește"
          exit 1
        fi
        echo "Tokenul este disponibil"

      