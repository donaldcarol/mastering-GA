name: Demo versiune

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
 publish-release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Afișează versiunea
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          printf 'Versiune: %s\n' "$VERSION"
          printf 'Commit: %s\n' "$COMMIT"

      - name: Generează fișierul versiunii
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            printf 'Versiune: %s\n' "$VERSION"
            printf 'Commit: %s\n' "$COMMIT"
          } > version.txt

      - name: Creează GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" version.txt \
            --verify-tag \
            --title "Versiunea $VERSION" \
            --notes "Release de exercițiu creat prin GitHub Actions."

 tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/donaldcarol/ci-tools:1.0
    steps:
      - name: Descarcă repository-ul
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Execută testele
        run: python -m unittest -v test_calculator