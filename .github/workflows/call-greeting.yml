name: Apelează salutul

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      person:
        description: Pe cine salutăm?
        required: true
        default: Donald
        type: string

permissions: {}
jobs:
  call-greeting:
    uses: ./.github/workflows/reusable-greeting.yml
    with:
      person: ${{ inputs.person || 'prietene' }}
    secrets:
      demo_token: ${{ secrets.DEMO_TOKEN }}

  show-result:
    needs: call-greeting
    runs-on: ubuntu-latest
    steps:
      - name: Afișează outputul primit
        env:
          MESSAGE: ${{ needs.call-greeting.outputs.message }}
        run: >-
          printf 'Output primit: %s\n' "$MESSAGE"
      