name: Artifacts demo

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Creează raportul
        run: echo "Raport generat în build" > report.txt

      - name: Încarcă raportul
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raport-test
          path: report.txt
          if-no-files-found: error
          retention-days: 3

  read-report:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă raportul
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raport-test
          path: downloaded

      - name: Citește raportul
        run: cat downloaded/report.txt