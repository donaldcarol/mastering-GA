name: Caching

on:
    workflow_dispatch:
        inputs:
            use-cache:
                description: Use cached dependencies
                type: boolean
                default: true



jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 13-caching/react-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: 13-caching/react-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Testing
        run: npm test

      - name: Build project
        run: npm run build

      - name: Deploy to nonprod
        run: echo "Deploying to non-production environment..."

        