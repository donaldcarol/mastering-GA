name: Environments demo

on:
  workflow_dispatch:

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Verifică staging
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL lipsește pentru staging"
            exit 1
          fi
          echo "Staging: $APP_URL"

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Verifică production
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL lipsește pentru production"
            exit 1
          fi
          echo "Production: $APP_URL"