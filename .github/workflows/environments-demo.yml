name: Environments demo

on:
  workflow_dispatch:

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Verifică staging
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL lipsește pentru staging"
            exit 1
          fi
          echo "Staging: $APP_URL"

     # - name: Simulează un eșec
     #   run: exit 1
      - name: Verifică secretul
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN lipsește"
            exit 1
          fi
          echo "DEPLOY_TOKEN este disponibil"

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Verifică production
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL lipsește pentru production"
            exit 1
          fi
          echo "Production: $APP_URL"

      - name: Verifică secretul
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN lipsește"
            exit 1
          fi
          echo "DEPLOY_TOKEN este disponibil"