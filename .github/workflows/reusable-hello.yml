name: Reusable Hello Workflow

on:
  workflow_call:
    inputs:
      person:
        description: "Person to greet"
        required: true
        type: string

    outputs:
      greeting:
        description: "The generated greeting"
        value: ${{ jobs.say_hello.outputs.greeting }}

jobs:
  say_hello:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    outputs:
      greeting: ${{ steps.create_greeting.outputs.message }}

    steps:
      - name: Create greeting
        id: create_greeting
        env:
          PERSON: ${{ inputs.person }}
        run: |
          echo "Hello, $PERSON!"
          echo "message=Hello, $PERSON!" >> "$GITHUB_OUTPUT"