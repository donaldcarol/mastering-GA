name: Execution Control Demo

on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Simulate a command failure?"
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  error-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Start operation
        run: |
          echo "The operation has started."

      - name: Run potentially failing command
        id: risky_step
        continue-on-error: true
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          echo "Simulate failure: $SIMULATE_FAILURE"

          if [[ "$SIMULATE_FAILURE" == "true" ]]; then
            echo "::error::The simulated operation failed."
            exit 1
          fi

          echo "The simulated operation succeeded."

      - name: Continue normal processing
        run: |
          echo "The workflow continues after the tolerated error."

      - name: Handle job failure
        if: ${{ failure() }}
        run: |
          echo "This will not run for a tolerated step failure."

      - name: Handle tolerated step failure
        if: ${{ steps.risky_step.outcome == 'failure' }}
        run: |
          echo "The risky step failed, but the failure was tolerated."
          echo "Here we could record a warning or use a fallback."

      - name: Show step status
        if: ${{ always() }}
        run: |
          echo "Outcome: ${{ steps.risky_step.outcome }}"
          echo "Conclusion: ${{ steps.risky_step.conclusion }}"

      - name: Cleanup
        if: ${{ always() }}
        run: |
          echo "Cleanup completed."