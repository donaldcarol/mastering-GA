name: Salut reutilizabil

on:
  workflow_call:
    inputs:
      person:
        description: Persoana salutată
        required: false
        type: string
        default: prietene
    secrets:
      demo_token:
        required: true

        
permissions: {}

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
    - name: Afișează salutul
      env:
        PERSON: ${{ inputs.person }}
      run: printf 'Salut, %s!\n' "$PERSON"

    - name: Verifică secretul primit
      env:
          DEMO_TOKEN: ${{ secrets.demo_token }}
      run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "::error::Secretul demo_token lipsește"
            exit 1
          fi
          echo "Secretul demo_token este disponibil"