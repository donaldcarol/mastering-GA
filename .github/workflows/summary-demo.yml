name: Demo job summary

on:
  workflow_dispatch:

permissions: {}

jobs:
  demo:
    runs-on: ubuntu-latest
       
    steps:
      - name: Verifică Git
        id: check-git
        run: |
          git --version
          exit 1

      - name: Scrie raportul
        if: always()
        env:
          RESULT: ${{ steps.check-git.outcome }}
        run: |
          {
            echo '## Verificarea uneltelor'
            echo ''
            echo '| Unealtă | Rezultat |'
            echo '|---|---|'
            printf '| Git | %s |\n' "$RESULT"
          } >> "$GITHUB_STEP_SUMMARY"