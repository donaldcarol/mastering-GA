name: Demo composite action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă repository-ul
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Apelează acțiunea locală
        id: greeting
        uses: ./.github/actions/greeting
        with:
          person: Donald

      - name: Citește outputul acțiunii
        env:
          MESSAGE: ${{ steps.greeting.outputs.message }}
        run: |
          printf 'Output primit: %s\n' "$MESSAGE"