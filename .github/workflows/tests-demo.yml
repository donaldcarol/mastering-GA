name: Demo teste Python

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/donaldcarol/ci-tools:1.0

    steps:
      - name: Descarcă repository-ul
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Execută testele
        id: run-tests
        run: |
          mkdir -p reports
          python -m unittest -v test_calculator > reports/tests.txt 2>&1

      
      - name: Afișează raportul în log
        if: always()
        run: cat reports/tests.txt

      - name: Salvează raportul ca artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: raport-teste
          path: reports/tests.txt
          retention-days: 7
          if-no-files-found: error  


          
      - name: Scrie raportul
        if: always()
        env:
          RESULT: ${{ steps.run-tests.outcome }}
        run: |
          {
            echo '## Teste Python'
            echo ''
            echo '| Verificare | Rezultat |'
            echo '|---|---|'
            printf '| Teste calculator | %s |\n' "$RESULT"
          } >> "$GITHUB_STEP_SUMMARY"